<div class="min-h-screen bg-[#f6f4ef] text-[#17221d]">
  <header class="border-b border-[#d9ddd3] bg-[#f6f4ef]/95">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5 lg:px-8">
      <a routerLink="/" class="group flex items-center gap-3" aria-label="ng-comark-content, home">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#d95f3d] text-sm font-black text-white transition-transform group-hover:rotate-12">N</span>
        <span class="font-mono text-sm font-bold uppercase tracking-[0.22em]">ng-comark-content</span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium text-[#647067]">
        <a routerLink="/" routerLinkActive="text-[#17221d]" [routerLinkActiveOptions]="{ exact: true }" class="transition-colors hover:text-[#d95f3d]">Archive</a>
        <span class="hidden font-mono text-xs uppercase tracking-widest text-[#9aa39b] sm:inline">Notes from the edge</span>
      </nav>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="mx-auto flex max-w-6xl justify-between px-6 py-10 font-mono text-xs uppercase tracking-widest text-[#8b958d] lg:px-8">
    <span>ng-comark-content / 2026</span>
    <span>Made for slow reading</span>
  </footer>
</div>
